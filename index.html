<html lang="de">
<head>

<title>Vormärz-Trainer</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #d2d2d7;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --ok: #15803d;
    --ok-soft: #e3f6e8;
    --bad: #c62828;
    --bad-soft: #fdecec;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f12;
      --card: #1c1c21;
      --text: #f5f5f7;
      --muted: #9a9aa3;
      --line: #3a3a42;
      --accent: #9192ff;
      --accent-soft: #24244a;
      --ok: #4ade80;
      --ok-soft: #13301f;
      --bad: #ff7b7b;
      --bad-soft: #3a1c1c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 20px;
    line-height: 1.4;
    padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .hidden { display: none !important; }

  /* ---------- Kopf mit Bereichs-Umschalter ---------- */
  .top {
    max-width: 1080px;
    margin: 0 auto 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .top h1, .tl-title {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0;
  }
  .tabs {
    display: flex;
    gap: 2px;
    padding: 4px;
    border-radius: 14px;
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .tabs button {
    background: transparent;
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.85em;
  }
  .tabs button.active { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .tabs button.active { color: #111; } }

  .view:not(.active) { display: none !important; }
  .app {
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 28px;
  }
  .learn { max-width: 760px; margin: 0 auto; }
  .learn-intro { color: var(--muted); font-size: 0.85em; margin: 0 0 8px; }

  /* ---------- Karten ---------- */
  .panel { position: relative; z-index: 5; align-self: start; }
  @media (min-width: 600px) and (min-height: 700px) {
    .panel { position: sticky; top: 12px; }
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 26px 24px;
    box-shadow: var(--shadow);
  }
  .progress {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.8em;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .bar {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .bar > div {
    height: 100%;
    background: var(--accent);
    width: 0;
    border-radius: 3px;
    transition: width .35s ease;
  }
  .label { color: var(--muted); font-size: 0.8em; margin-bottom: 2px; }
  .event {
    font-size: 1.6em;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .prev {
    color: var(--muted);
    font-size: 0.85em;
    margin-bottom: 20px;
    min-height: 1.4em;
  }
  .prev b { color: var(--text); font-family: var(--rounded); font-variant-numeric: tabular-nums; }

  /* ---------- Jahreszahl-Eingabe ---------- */
  form { display: flex; gap: 10px; }
  .fields { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .dash { color: var(--muted); font-size: 1.4em; font-weight: 600; }
  .fields.single .dash, .fields.single #answer2 { display: none; }
  input {
    flex: 1;
    min-width: 0;
    text-align: center;
    font: inherit;
    font-family: var(--rounded);
    font-size: 1.5em;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 10px 8px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: var(--bg);
    color: var(--text);
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus { outline: none; border-color: var(--accent); }
  input, button { touch-action: manipulation; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 12px 20px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    -webkit-appearance: none;
  }
  @media (prefers-color-scheme: dark) { button { color: #111; } }
  button.secondary { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
  button.wide { width: 100%; padding: 15px; }
  .linkbtn {
    background: none;
    color: var(--muted);
    padding: 0;
    font-weight: 400;
    font-size: inherit;
    text-decoration: underline;
  }
  @media (prefers-color-scheme: dark) { .linkbtn { color: var(--muted); } }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 14px;
    display: none;
  }
  .feedback.ok { display: block; background: var(--ok-soft); color: var(--ok); }
  .feedback.bad { display: block; background: var(--bad-soft); color: var(--bad); }
  .feedback .main { font-weight: 600; }
  .feedback .main b { font-family: var(--rounded); font-size: 1.15em; }
  .feedback .rel, .feedback .note { color: var(--text); opacity: .8; font-size: 0.85em; margin-top: 4px; }
  .feedback .fix { color: var(--text); font-size: 0.85em; margin-top: 8px; font-weight: 600; }
  .feedback .fix.done { color: var(--ok); }
  .fields.shake { animation: shake .35s; }
  .fields.shake input { border-color: var(--bad); }
  @keyframes shake {
    0%, 100% { transform: none; }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .score {
    font-family: var(--rounded);
    font-size: 3.2em;
    font-weight: 800;
    text-align: center;
    margin: 4px 0 0;
    font-variant-numeric: tabular-nums;
  }
  .score-sub { text-align: center; color: var(--muted); margin-bottom: 22px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .actions button { width: 100%; padding: 15px; }

  /* ---------- Wissens-Quiz ---------- */
  .chip {
    display: inline-block;
    font-size: 0.72em;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .qprompt { font-size: 1.3em; font-weight: 700; line-height: 1.25; margin: 0 0 16px; }
  .opts { display: grid; gap: 8px; }
  .opts.events { grid-template-columns: 1fr 1fr; }
  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    background: var(--bg);
    color: var(--text);
    box-shadow: inset 0 0 0 2px var(--line);
    font-weight: 500;
    font-size: 0.9em;
    line-height: 1.3;
    padding: 12px 14px;
    border-radius: 12px;
    transition: background .15s, box-shadow .15s, opacity .2s;
  }
  .opt .ol { flex: 1; }
  .opt small { display: block; color: var(--muted); font-family: var(--rounded); font-weight: 600; font-size: 0.85em; }
  .opt .k {
    display: none;
    flex: none;
    width: 1.6em; height: 1.6em;
    border-radius: 6px;
    background: var(--card);
    color: var(--muted);
    font-size: 0.75em;
    font-weight: 700;
    align-items: center;
    justify-content: center;
  }
  @media (hover: hover) and (pointer: fine) { .opt .k { display: inline-flex; } }
  .opt .box {
    flex: none;
    width: 22px; height: 22px;
    border-radius: 7px;
    box-shadow: inset 0 0 0 2px var(--line);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: transparent;
  }
  .opt.sel { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
  .opt.sel .box { background: var(--accent); box-shadow: none; color: #fff; }
  .opt.ok { box-shadow: inset 0 0 0 2px var(--ok); background: var(--ok-soft); color: var(--ok); }
  .opt.bad { box-shadow: inset 0 0 0 2px var(--bad); background: var(--bad-soft); color: var(--bad); }
  .opt.missed { box-shadow: none; outline: 2px dashed var(--ok); outline-offset: -2px; }
  .opt.dim { opacity: .45; }
  .opt.picked .box { box-shadow: none; color: var(--card); }
  .opt.ok.picked .box { background: var(--ok); }
  .opt.bad.picked .box { background: var(--bad); }
  .opt:disabled { cursor: default; }
  .answerbox {
    background: var(--bg);
    border-radius: 12px;
    padding: 12px 14px;
    white-space: pre-line;
    font-size: 0.9em;
  }
  .answerbox .label { margin-bottom: 4px; }
  .selfrate { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .selfrate .yes { background: var(--ok); }
  .selfrate .no { background: var(--bad); }
  .qactions { margin-top: 14px; }
  .qactions button { width: 100%; }
  .qfoot { text-align: center; font-size: 0.75em; margin-top: 12px; }

  .field { margin-bottom: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chips button {
    padding: 6px 12px;
    font-size: 0.78em;
    font-weight: 500;
    border-radius: 999px;
    background: var(--bg);
    color: var(--muted);
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .chips button.on { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .seg { display: flex; gap: 2px; background: var(--bg); border-radius: 12px; padding: 3px; margin-top: 4px; }
  .seg button {
    flex: 1;
    background: transparent;
    color: var(--muted);
    padding: 8px;
    font-size: 0.82em;
    border-radius: 10px;
  }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .stats { font-size: 0.78em; color: var(--muted); text-align: center; margin: 12px 0 0; }
  button:disabled { opacity: .45; cursor: default; }
  .opt:disabled { opacity: 1; }
  .opt.dim:disabled { opacity: .45; }

  /* ---------- Zeitstrahl ---------- */
  .timeline {
    list-style: none;
    margin: 0;
    padding: 8px 0;
    --yearw: 5.2em;
    --railw: 36px;
  }
  .timeline > li {
    display: grid;
    grid-template-columns: var(--yearw) var(--railw) 1fr;
    column-gap: 10px;
  }
  .rail { position: relative; align-self: stretch; }
  .rail::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    transform: translateX(-50%);
    background: var(--line);
  }
  .node.first .rail::before { top: 50%; }
  .node.last .rail::before { bottom: 50%; }
  .tl-notes:last-child .rail::before { display: none; }

  .node { min-height: 64px; align-items: center; }
  .year {
    font-family: var(--rounded);
    font-size: 1.5em;
    font-weight: 700;
    text-align: right;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    white-space: nowrap;
    transition: color .3s;
  }
  .year.long { font-size: 1.15em; }
  .dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: var(--card);
    border: 3px solid var(--line);
    transition: all .3s;
  }
  .info {
    padding: 10px 14px;
    border-radius: 14px;
    transition: background .3s;
  }
  .title { font-weight: 600; font-size: 1.05em; line-height: 1.25; }
  .meta { font-size: 0.75em; color: var(--muted); margin-top: 2px; }
  .meta s { opacity: .8; }

  .node.pending .year { color: var(--line); }
  .node.pending .title { color: var(--muted); font-weight: 500; }

  .node.current .year, .node.focus .year { color: var(--accent); }
  .node.current .dot, .node.focus .dot {
    width: 22px; height: 22px;
    border-color: var(--accent);
    background: var(--accent);
    box-shadow: 0 0 0 6px var(--accent-soft);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .node.current .info, .node.focus .info { background: var(--accent-soft); }
  .node.current .meta { color: var(--accent); font-weight: 600; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 6px var(--accent-soft); }
    50% { box-shadow: 0 0 0 11px var(--accent-soft); }
  }

  .node.known .dot { border-color: var(--accent); background: var(--accent); }
  .node.ok .year { color: var(--ok); }
  .node.ok .dot { border-color: var(--ok); background: var(--ok); }
  .node.bad .year { color: var(--bad); }
  .node.bad .dot { border-color: var(--bad); background: var(--bad); }
  .node.bad .meta { color: var(--bad); }

  .gap {
    height: var(--h, 34px);
    transition: height .6s cubic-bezier(.2,.8,.2,1);
    align-items: center;
  }
  .gap .rail::before {
    background: repeating-linear-gradient(to bottom, var(--line) 0 4px, transparent 4px 9px);
  }
  .gap.revealed .rail::before { background: var(--accent); opacity: .45; }
  .gap .rail::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 2px;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 8px solid var(--line);
  }
  .gap.revealed .rail::after { border-top-color: var(--accent); }
  .pill {
    display: inline-block;
    font-size: 0.8em;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    color: var(--accent);
    background: var(--accent-soft);
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity .4s .15s, transform .4s .15s;
    font-variant-numeric: tabular-nums;
    margin-left: 14px;
  }
  .gap.revealed .pill { opacity: 1; transform: none; }

  /* Lernen: antippbare Ereignisse mit Notizen */
  .clickable .node .info { cursor: pointer; }
  .clickable .node .info:hover { background: var(--accent-soft); }
  .clickable .node .title::after { content: " ›"; color: var(--muted); font-weight: 400; }
  .clickable .node.open .title::after { content: " ⌄"; }
  .clickable .node.open .info { background: var(--accent-soft); }
  .timeline > .tl-notes { display: none; }
  .timeline > .tl-notes.open { display: grid; }
  .notecard {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin: 4px 0 14px;
    font-size: 0.85em;
  }
  .notecard .where { color: var(--bad); font-weight: 700; margin-bottom: 6px; }
  .notecard .ni { margin: 6px 0; }
  .notecard .nk { font-weight: 600; }
  .notecard ul { margin: 2px 0 0; padding-left: 1.2em; }
  .notecard li { margin: 2px 0; }
  .nfoot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.9em;
  }
  .nfoot button { padding: 8px 12px; font-size: 0.9em; border-radius: 10px; white-space: nowrap; }

  /* ---------- Layout ---------- */
  .tl-title { margin-bottom: 4px; }
  @media (min-width: 900px) {
    .app { grid-template-columns: minmax(360px, 420px) 1fr; align-items: start; gap: 48px; }
    .panel { top: 24px; }
    .app .timeline { padding-top: 34px; }
    .app .tl-title { display: none; }
  }
  @media (max-width: 899px) {
    .card { padding: 20px 18px; }
    .event { font-size: 1.4em; }
    #view-quiz .tl-wrap { display: none; }
  }
  @media (max-width: 599px) {
    body { font-size: 17px; padding-top: calc(12px + env(safe-area-inset-top)); }
    .top { margin-bottom: 14px; gap: 8px; }
    .top h1 { font-size: 0.72rem; }
    .tabs { width: 100%; }
    .tabs button { flex: 1; padding: 8px 4px; }
    .app { gap: 20px; }
    .card { padding: 16px; border-radius: 18px; }
    .progress { font-size: 0.75em; margin-bottom: 6px; }
    .bar { height: 5px; margin-bottom: 14px; }
    .label { font-size: 0.75em; }
    .event { font-size: 1.35em; margin-bottom: 4px; }
    .prev { font-size: 0.8em; margin-bottom: 12px; }
    input { font-size: 1.4em; padding: 8px; border-radius: 12px; }
    form { flex-wrap: wrap; gap: 8px; }
    form button { width: 100%; padding: 13px; border-radius: 12px; }
    .feedback { margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-size: 0.95em; }
    .feedback .fix { margin-top: 4px; }
    .score { font-size: 2.6em; }
    .score-sub { margin-bottom: 16px; font-size: 0.9em; }
    .actions button, button.wide { padding: 13px; }
    .qprompt { font-size: 1.15em; margin-bottom: 12px; }
    .opt { padding: 10px 12px; }
    .opts.events { gap: 6px; }
    .qactions button { padding: 13px; border-radius: 12px; }
    .timeline { --yearw: 4.6em; --railw: 28px; }
    .timeline > li { column-gap: 6px; }
    .nfoot { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Vormärz · 1813–1832</h1>
  <nav class="tabs" id="tabs">
    <button data-view="learn">Lernen</button>
    <button data-view="years">Jahreszahlen</button>
    <button data-view="quiz">Quiz</button>
  </nav>
</header>

<!-- ===== Lernen ===== -->
<section class="view learn" id="view-learn">
  <p class="learn-intro">Tippe auf ein Ereignis, um die Zusammenfassung zu sehen.</p>
  <ol class="timeline clickable" id="tlLearn" aria-label="Zeitstrahl mit Zusammenfassungen"></ol>
</section>

<!-- ===== Jahreszahlen ===== -->
<section class="view app" id="view-years">
  <div class="panel" id="yPanel">
    <section id="yQuiz" class="card">
      <div class="progress">
        <span id="roundLabel">Runde 1</span>
        <span id="countLabel">1 / 8</span>
      </div>
      <div class="bar"><div id="barFill"></div></div>

      <div class="label">In welchem Jahr?</div>
      <p class="event" id="eventText"></p>
      <div class="prev" id="prevText"></div>

      <form id="answerForm" autocomplete="off">
        <div class="fields" id="fields">

    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  // Fortschritt bleibt im Browser des jeweiligen Geräts gespeichert
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  function gapYears(i) { return EVENTS[i + 1].start - EVENTS[i].end; }
  function gapText(d) { return d === 0 ? "im selben Jahr" : d === 1 ? "1 Jahr später" : d + " Jahre später"; }

  // ================================================================
  //  Zeitstrahl (wird in allen drei Bereichen verwendet)
  // ================================================================
  function buildTimeline(ol, withNotes) {
    ol.innerHTML = "";
    EVENTS.forEach((ev, i) => {
      const li = document.createElement("li");
      li.className = "node";
      li.dataset.i = i;
      li.innerHTML =
        '<div class="year' + (ev.display.length > 4 ? " long" : "") + '"></div>' +
        '<div class="rail"><span class="dot"></span></div>' +
        '<div class="info"><div class="title"></div><div class="meta"></div></div>';
      li.querySelector(".title").textContent = ev.name;
      ol.appendChild(li);

      if (withNotes) {
        const n = document.createElement("li");
        n.className = "tl-notes";
        n.dataset.i = i;
        n.innerHTML = '<div></div><div class="rail"></div><div class="notecard"></div>';
        ol.appendChild(n);
      }
      if (i < EVENTS.length - 1) {
        const gap = document.createElement("li");
        gap.className = "gap";
        gap.dataset.i = i;
        gap.setAttribute("aria-hidden", "true");
        gap.innerHTML = '<div></div><div class="rail"></div><div><span class="pill"></span></div>';
        gap.querySelector(".pill").textContent = "↓ " + gapText(gapYears(i));
        ol.appendChild(gap);
      }
    });
  }
  const nodeOf = (ol, i) => ol.querySelector('.node[data-i="' + i + '"]');

  // statusFn(i): "pending" | "current" | "ok" | "bad" | "known" | "focus"
  function renderTimeline(ol, statusFn, metaFn) {
    const revealed = (i) => ["ok", "bad", "known", "focus"].includes(statusFn(i));
    EVENTS.forEach((ev, i) => {
      const s = statusFn(i);
      const node = nodeOf(ol, i);
      const open = node.classList.contains("open");
      node.className = "node " + s + (i === 0 ? " first" : "") + (i === EVENTS.length - 1 ? " last" : "") + (open ? " open" : "");
      node.querySelector(".year").textContent = (s === "pending" || s === "current") ? "?" : ev.display;
      node.querySelector(".meta").innerHTML = metaFn ? metaFn(i, s) : "";

      if (i < EVENTS.length - 1) {
        const gap = ol.querySelector('.gap[data-i="' + i + '"]');
        const show = revealed(i) && revealed(i + 1);
        gap.classList.toggle("revealed", show);
        // Abstand wächst proportional zu den Jahren dazwischen
        gap.style.setProperty("--h", show ? (40 + gapYears(i) * 14) + "px" : "34px");
      }
    });
  }

  function scrollToNode(ol, i, panel) {
    const node = nodeOf(ol, i);
    if (!node) return;
    // Auf dem Handy scrollt die Karte mit – dann bleibt die Frage oben im Blick
    if (getComputedStyle(panel).position !== "sticky") return;
    const narrow = window.matchMedia("(max-width: 899px)").matches;
    node.style.scrollMarginTop = (narrow ? panel.offsetHeight + 110 : 140) + "px";
    node.style.scrollMarginBottom = "120px";
    node.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // ================================================================
  //  Bereiche umschalten
  // ================================================================
  let view = "learn";
  function showView(name) {
    view = name;
    document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === "view-" + name));
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.view === name));
    store.set("vm-view", name);
    if (name === "learn") renderLearn();
    if (name === "quiz") { renderQuizStart(); renderQuizTimeline(); }
    if (name === "years" && !$("yQuiz").classList.contains("hidden")) input.focus();
  }
  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-view]");
    if (b) showView(b.dataset.view);
  });

  // ================================================================
  //  LERNEN
  // ================================================================
  const tlLearn = $("tlLearn");
  buildTimeline(tlLearn, true);

  function mastery(i) {
    const qs = QUESTIONS.filter((q) => q.ev === EVENTS[i].id);
    const known = qs.filter((q) => progress[q.id] === 1).length;
    return { known, total: qs.length };
  }
  function renderLearn() {
    renderTimeline(tlLearn, () => "known", (i) => {
      const m = mastery(i);
      return m.total ? "Quiz: " + m.known + " / " + m.total + " sicher" : "";
    });
  }
  function notesHtml(i) {
    const ev = EVENTS[i];
    const where = [ev.place, ev.display].filter(Boolean).join(", ");
    let h = '<div class="where">' + esc(where) + "</div>";
    ev.notes.forEach(([k, v]) => {
      if (Array.isArray(v)) {
        h += '<div class="ni"><span class="nk">' + esc(k) + ":</span><ul>" + v.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
      } else if (v) {
        h += '<div class="ni"><span class="nk">' + esc(k) + ":</span> " + esc(v) + "</div>";
      } else {
        h += '<div class="ni">' + esc(k) + "</div>";
      }
    });
    const m = mastery(i);
    h += '<div class="nfoot"><span>' + m.known + " von " + m.total + " Quizfragen sicher</span>" +
         '<button class="secondary" data-practice="' + i + '">Fragen dazu üben →</button></div>';
    return h;
  }
  tlLearn.addEventListener("click", (e) => {
    const practice = e.target.closest("[data-practice]");
    if (practice) {
      practiceEvent(+practice.dataset.practice);
      return;
    }
    const info = e.target.closest(".node .info");
    if (!info) return;
    const node = info.parentElement;
    const i = node.dataset.i;
    const notes = tlLearn.querySelector('.tl-notes[data-i="' + i + '"]');
    const open = !node.classList.contains("open");
    node.classList.toggle("open", open);
    notes.classList.toggle("open", open);
    if (open) notes.querySelector(".notecard").innerHTML = notesHtml(+i);
  });

  // ================================================================
  //  JAHRESZAHLEN-QUIZ
  // ================================================================
  const tlYears = $("tlYears");
  buildTimeline(tlYears, false);
  const input = $("answer");
  const input2 = $("answer2");
  const feedback = $("feedback");

  let round = 0;
  let queue = [];          // Indizes der Ereignisse dieser Runde
  let inRound = new Set();
  let pos = 0;
  let correct = 0;
  let wrong = [];
  let results = {};        // index -> { status: "ok"|"bad", given }
  let locked = ["", ""];   // angezeigte Antwort nach dem Prüfen
  let phase = "ask";       // "ask" → bei falscher Antwort "fix" (richtiges Jahr eintippen) → "done"
  let finished = false;

  // Zwei Felder: "1814" oder "1814" – "1815" (auch "15" als Kurzform). Ergebnis z. B. "1814-1815"
  function readAnswer() {
    const a = input.value;
    let b = input2.value;
    if (!a) return { value: "", shown: "" };
    if (b.length === 2) b = a.slice(0, 2) + b;
    if (!b || b === a) return { value: a, shown: a };
    return { value: a + "-" + b, shown: a + "–" + input2.value };
  }
  function clearFields() {
    input.value = "";
    input2.value = "";
    input.focus();
  }

  function status(i) {
    if (results[i]) return results[i].status;
    if (!inRound.has(i)) return "known";
    if (!finished && i === queue[pos]) return "current";
    return "pending";
  }
  function renderYears() {
    renderTimeline(tlYears, status, (i, s) => {
      if (s === "current") return "Jetzt gefragt";
      if (s === "ok") return "✓ richtig";
      if (s === "bad") return "✗ deine Antwort: <s>" + esc(results[i].given) + "</s>";
      return "";
    });
  }

  function startRound(indices) {
    round++;
    queue = indices.slice(); // chronologische Reihenfolge
    inRound = new Set(queue);
    pos = 0;
    correct = 0;
    wrong = [];
    results = {};
    finished = false;
    $("yResult").classList.add("hidden");
    $("yQuiz").classList.remove("hidden");
    showQuestion();
  }

  function showQuestion() {
    phase = "ask";
    const i = queue[pos];
    const ev = EVENTS[i];
    $("roundLabel").textContent = "Runde " + round;
    $("countLabel").textContent = (pos + 1) + " / " + queue.length;
    $("barFill").style.width = (pos / queue.length * 100) + "%";
    $("eventText").textContent = ev.name;
    $("prevText").innerHTML = i > 0
      ? "Davor: " + esc(EVENTS[i - 1].name) + " · <b>" + EVENTS[i - 1].display + "</b>"
      : "Das erste Ereignis auf dem Zeitstrahl";
    $("fields").classList.toggle("single", ev.end === ev.start);
    input.placeholder = ev.end === ev.start ? "Jahr" : "von";
    input2.placeholder = "bis";
    input.value = "";
    input2.value = "";
    feedback.className = "feedback";
    feedback.innerHTML = "";
    $("submitBtn").textContent = "Prüfen";
    renderYears();
    scrollToNode(tlYears, i, $("yPanel"));
    if (view === "years") input.focus();
  }

  function check() {
    const { value, shown } = readAnswer();
    if (!value) { input.focus(); return; }
    const i = queue[pos];
    const ev = EVENTS[i];
    const ok = ev.accept.includes(value);
    results[i] = { status: ok ? "ok" : "bad", given: shown };
    if (ok) correct++; else wrong.push(i);

    let rel = "";
    if (i > 0) {
      const d = gapYears(i - 1);
      const prevName = "„" + esc(EVENTS[i - 1].name) + "“";
      rel = d === 0 ? "Im selben Jahr wie " + prevName
          : (d === 1 ? "1 Jahr" : d + " Jahre") + " nach " + prevName;
    }
    feedback.className = "feedback " + (ok ? "ok" : "bad");
    feedback.innerHTML =
      '<div class="main">' + (ok ? "✓ Richtig! " : "✗ Leider falsch. Richtig ist ") + "<b>" + ev.display + "</b></div>" +
      (rel ? '<div class="rel">' + rel + "</div>" : "") +
      (ok ? "" : '<div class="fix" id="fixText">Tippe die richtige Jahreszahl ein, um weiterzumachen.</div>');

    $("barFill").style.width = ((pos + 1) / queue.length * 100) + "%";
    renderYears();

    if (ok) {
      finishQuestion();
    } else {
      // Erst weiter, wenn die richtige Jahreszahl einmal selbst eingetippt wurde
      phase = "fix";
      input.placeholder = String(ev.start);
      input2.placeholder = ev.end !== ev.start ? String(ev.end) : "bis";
      input.value = "";
      input2.value = "";
      $("submitBtn").textContent = "Bestätigen";
      input.focus();
    }
  }

  function checkFix() {
    const ev = EVENTS[queue[pos]];
    if (!ev.accept.includes(readAnswer().value)) {
      const f = $("fields");
      f.classList.remove("shake");
      void f.offsetWidth; // Animation neu starten
      f.classList.add("shake");
      clearFields();
      return;
    }
    const fix = $("fixText");
    fix.textContent = "✓ " + ev.name + " – " + ev.display + ". Gemerkt!";
    fix.classList.add("done");
    finishQuestion();
  }

  function finishQuestion() {
    phase = "done";
    locked = [input.value, input2.value];
    $("submitBtn").textContent = pos + 1 < queue.length ? "Weiter" : "Ergebnis";
  }

  function next() {
    pos++;
    if (pos < queue.length) showQuestion();
    else showResult();
  }

  function showResult() {
    finished = true;
    renderYears();
    $("yQuiz").classList.add("hidden");
    $("yResult").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
    $("resultRound").textContent = "Ergebnis Runde " + round;
    $("scoreText").textContent = correct + " / " + queue.length;
    $("scoreSub").textContent = wrong.length === 0
      ? "Alles richtig – sehr gut!"
      : "Die rot markierten Ereignisse kommen in der nächsten Runde wieder.";

    const btn = $("nextRoundBtn");
    btn.textContent = wrong.length === 0
      ? "Nochmal alle üben"
      : "Nächste Runde (" + wrong.length + " " + (wrong.length === 1 ? "Ereignis" : "Ereignisse") + ")";
    $("restartBtn").classList.toggle("hidden", wrong.length === 0);
    btn.focus();
  }

  $("answerForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if (phase === "ask") check();
    else if (phase === "fix") checkFix();
    else next();
  });
  // Tippen auf den Button nimmt dem Eingabefeld nicht den Fokus → Tastatur klappt nicht zu und wieder auf
  $("submitBtn").addEventListener("mousedown", (e) => e.preventDefault());
  $("fields").addEventListener("animationend", () => $("fields").classList.remove("shake"));

  // Nur Ziffern; nach 4 Ziffern springt der Cursor ins zweite Feld
  input.addEventListener("input", () => {
    if (phase === "done") { input.value = locked[0]; return; }
    input.value = input.value.replace(/\D/g, "").slice(0, 4);
    if (input.value.length === 4 && !$("fields").classList.contains("single")) input2.focus();
  });
  input2.addEventListener("input", () => {
    if (phase === "done") { input2.value = locked[1]; return; }
    input2.value = input2.value.replace(/\D/g, "").slice(0, 4);
  });
  // Rücktaste im leeren zweiten Feld springt zurück ins erste
  input2.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && input2.value === "" && phase !== "done") {
      e.preventDefault();
      input.focus();
      input.value = input.value.slice(0, -1);
    }
  });
  $("nextRoundBtn").addEventListener("click", () => startRound(wrong.length ? wrong : ALL));
  $("restartBtn").addEventListener("click", () => { round = 0; startRound(ALL); });

  // ================================================================
  //  WISSENS-QUIZ
  // ================================================================
  const tlQuiz = $("tlQuiz");
  buildTimeline(tlQuiz, false);

  let progress = store.get("vm-progress", {});   // Frage-id -> 1 (sicher) | 0 (zuletzt falsch)
  const saved = store.get("vm-quiz-settings", {});
  const settings = {
    events: new Set(Array.isArray(saved.events) && saved.events.length ? saved.events : EVENTS.map((e) => e.id)),
    order: saved.order === "mixed" ? "mixed" : "chrono",
    size: [10, 20, 0].includes(saved.size) ? saved.size : 10,
  };
  const saveSettings = () => store.set("vm-quiz-settings", { events: [...settings.events], order: settings.order, size: settings.size });

  let qRound = 0;
  let qQueue = [];
  let qPos = 0;
  let qCorrect = 0;
  let qWrong = [];
  let qPhase = "ask";      // "ask" → ("reveal" bei Erklär-Karten) → "done"
  let qFirst = true;       // noch kein Fehlversuch bei dieser Frage
  let qRunning = false;

  function renderQuizStart() {
    $("qChips").innerHTML =
      '<button data-ev="all" class="' + (settings.events.size === EVENTS.length ? "on" : "") + '">Alle</button>' +
      EVENTS.map((e) => '<button data-ev="' + e.id + '" class="' + (settings.events.has(e.id) ? "on" : "") + '">' + esc(e.name) + "</button>").join("");
    document.querySelectorAll("#qOrder button").forEach((b) => b.classList.toggle("on", b.dataset.v === settings.order));
    document.querySelectorAll("#qSize button").forEach((b) => b.classList.toggle("on", +b.dataset.v === settings.size));
    $("qStartBtn").disabled = settings.events.size === 0;
    const known = QUESTIONS.filter((q) => progress[q.id] === 1).length;
    $("qStats").innerHTML = "Du kannst " + known + " von " + QUESTIONS.length + " Fragen sicher." +
      (known || Object.keys(progress).length ? ' · <button class="linkbtn" id="qReset">Zurücksetzen</button>' : "");
  }
  $("qChips").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.ev === "all") {
      settings.events = settings.events.size === EVENTS.length ? new Set() : new Set(EVENTS.map((x) => x.id));
    } else if (settings.events.has(b.dataset.ev)) {
      settings.events.delete(b.dataset.ev);
    } else {
      settings.events.add(b.dataset.ev);
    }
    saveSettings();
    renderQuizStart();
  });
  $("qOrder").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    settings.order = b.dataset.v;
    saveSettings();
    renderQuizStart();
  });
  $("qSize").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    settings.size = +b.dataset.v;
    saveSettings();
    renderQuizStart();
  });
  $("qStats").addEventListener("click", (e) => {
    if (e.target.id !== "qReset") return;
    if (!confirm("Fortschritt im Wissens-Quiz auf diesem Gerät zurücksetzen?")) return;
    progress = {};
    store.set("vm-progress", progress);
    renderQuizStart();
  });

  function startQuizFromSettings() {
    const order = (q) => EV_INDEX[q.ev] * 1000 + QUESTIONS.indexOf(q);
    let pool = QUESTIONS.filter((q) => settings.events.has(q.ev));
    // Unsichere und neue Fragen zuerst, bei Gleichstand zufällig
    pool = shuffle(pool).sort((a, b) => (progress[a.id] === 1) - (progress[b.id] === 1));
    if (settings.size) pool = pool.slice(0, settings.size);
    pool = settings.order === "chrono" ? pool.sort((a, b) => order(a) - order(b)) : shuffle(pool);
    qRound = 0;
    startQuiz(pool);
  }
  // Aus dem Lernbereich: alle Fragen zu einem Ereignis, ohne die Quiz-Einstellungen zu ändern
  function practiceEvent(i) {
    showView("quiz");
    qRound = 0;
    startQuiz(QUESTIONS.filter((q) => q.ev === EVENTS[i].id));
  }

  function startQuiz(list) {
    qRound++;
    qQueue = list;
    qPos = 0;
    qCorrect = 0;
    qWrong = [];
    qRunning = true;
    $("qStart").classList.add("hidden");
    $("qResult").classList.add("hidden");
    $("qRun").classList.remove("hidden");
    window.scrollTo({ top: 0 });
    showQ();
  }

  const curQ = () => qQueue[qPos];

  function renderQuizTimeline() {
    const q = qRunning ? curQ() : null;
    const focus = q && (q.type !== "event" || qPhase === "done") ? EV_INDEX[q.ev] : -1;
    renderTimeline(tlQuiz, (i) => (i === focus ? "focus" : "known"));
    if (focus >= 0) scrollToNode(tlQuiz, focus, $("qPanel"));
  }

  function showQ() {
    const q = curQ();
    const ev = EVENTS[EV_INDEX[q.ev]];
    qPhase = "ask";
    qFirst = true;

    $("qRoundLabel").textContent = "Runde " + qRound;
    $("qCount").textContent = (qPos + 1) + " / " + qQueue.length;
    $("qBar").style.width = (qPos / qQueue.length * 100) + "%";
    $("qChip").textContent = q.type === "event" ? "Ereignis zuordnen" : ev.name + " · " + ev.display;
    $("qPrompt").textContent = q.q;

    let options = [];
    if (q.type === "mc") options = shuffle([{ label: q.a, c: true }, ...q.o.map((o) => ({ label: o, c: false }))]);
    if (q.type === "multi") options = shuffle([...q.a.map((a) => ({ label: a, c: true })), ...q.o.map((o) => ({ label: o, c: false }))]);
    if (q.type === "event") options = EVENTS.map((e) => ({ label: e.name, sub: e.display, c: e.id === q.a }));

    const opts = $("qOpts");
    opts.className = "opts" + (q.type === "event" ? " events" : "");
    opts.innerHTML = options.map((o, n) =>
      '<button class="opt" data-c="' + (o.c ? 1 : 0) + '">' +
      (q.type === "multi" ? '<span class="box">✓</span>' : '<span class="k">' + (n + 1) + "</span>") +
      '<span class="ol">' + esc(o.label) + (o.sub ? "<small>" + esc(o.sub) + "</small>" : "") + "</span></button>"
    ).join("");

    $("qAnswer").classList.add("hidden");
    $("qSelf").classList.add("hidden");
    $("qFeedback").className = "feedback";
    $("qFeedback").innerHTML = "";

    const primary = $("qPrimary");
    primary.disabled = false;
    if (q.type === "multi") { primary.textContent = "Prüfen"; primary.parentElement.classList.remove("hidden"); }
    else if (q.type === "card") { primary.textContent = "Antwort aufdecken"; primary.parentElement.classList.remove("hidden"); }
    else primary.parentElement.classList.add("hidden");

    renderQuizTimeline();
  }

  function markWrong(q) {
    if (!qWrong.includes(q)) qWrong.push(q);
    progress[q.id] = 0;
    store.set("vm-progress", progress);
  }
  function markRight(q) {
    qCorrect++;
    progress[q.id] = 1;
    store.set("vm-progress", progress);
  }

  function showNote(ok, headline) {
    const q = curQ();
    $("qFeedback").className = "feedback " + (ok ? "ok" : "bad");
    $("qFeedback").innerHTML = '<div class="main">' + headline + "</div>" +
      (q.note ? '<div class="note">' + esc(q.note) + "</div>" : "");
  }

  function finishQ() {
    qPhase = "done";
    $("qOpts").querySelectorAll(".opt").forEach((b) => {
      b.disabled = true;
      if (!b.matches(".ok, .bad, .missed")) b.classList.add("dim");
    });
    const primary = $("qPrimary");
    primary.textContent = qPos + 1 < qQueue.length ? "Weiter" : "Ergebnis";
    primary.parentElement.classList.remove("hidden");
    $("qBar").style.width = ((qPos + 1) / qQueue.length * 100) + "%";
    renderQuizTimeline();
  }

  // Antwort antippen
  $("qOpts").addEventListener("click", (e) => {
    const b = e.target.closest(".opt");
    if (!b || qPhase === "done" || b.disabled) return;
    const q = curQ();
    if (q.type === "multi") {
      b.classList.toggle("sel");
      return;
    }
    if (b.dataset.c === "1") {
      b.classList.add("ok");
      if (qFirst) {
        markRight(q);
        showNote(true, "✓ Richtig!");
      } else {
        showNote(true, "✓ Jetzt stimmt's. Die Frage kommt in der nächsten Runde wieder.");
      }
      finishQ();
    } else {
      // Falsch: Antwort sperren, nochmal versuchen – zählt als Fehler
      b.classList.add("bad");
      b.disabled = true;
      if (qFirst) { qFirst = false; markWrong(q); }
      $("qFeedback").className = "feedback bad";
      $("qFeedback").innerHTML = '<div class="main">✗ Leider falsch – versuch es nochmal.</div>';
    }
  });

  function checkMulti() {
    const q = curQ();
    const btns = [...$("qOpts").querySelectorAll(".opt")];
    if (!btns.some((b) => b.classList.contains("sel"))) return;
    let allRight = true;
    btns.forEach((b) => {
      const c = b.dataset.c === "1";
      const sel = b.classList.contains("sel");
      b.classList.remove("sel");
      if (sel) b.classList.add("picked");
      if (c && sel) b.classList.add("ok");
      else if (c && !sel) { b.classList.add("missed"); allRight = false; }
      else if (!c && sel) { b.classList.add("bad"); allRight = false; }
    });
    if (allRight) { markRight(q); showNote(true, "✓ Alles richtig!"); }
    else { markWrong(q); showNote(false, "✗ Nicht ganz. Rot war falsch, gestrichelt hat gefehlt."); }
    finishQ();
  }

  function revealCard() {
    qPhase = "reveal";
    const q = curQ();
    $("qAnswer").innerHTML = '<div class="label">Antwort</div>' + esc(q.a);
    $("qAnswer").classList.remove("hidden");
    $("qSelf").classList.remove("hidden");
    $("qPrimary").parentElement.classList.add("hidden");
  }
  function rateCard(knew) {
    if (qPhase !== "reveal") return;
    if (knew) markRight(curQ()); else markWrong(curQ());
    nextQ();
  }
  $("qYes").addEventListener("click", () => rateCard(true));
  $("qNo").addEventListener("click", () => rateCard(false));

  $("qPrimary").addEventListener("click", () => {
    const q = curQ();
    if (qPhase === "done") nextQ();
    else if (q.type === "multi") checkMulti();
    else if (q.type === "card" && qPhase === "ask") revealCard();
  });

  function nextQ() {
    qPos++;
    if (qPos < qQueue.length) showQ();
    else showQuizResult();
  }

  function showQuizResult() {
    qRunning = false;
    $("qRun").classList.add("hidden");
    $("qResult").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
    $("qResRound").textContent = "Ergebnis Runde " + qRound;
    $("qScore").textContent = qCorrect + " / " + qQueue.length;
    $("qSub").textContent = qWrong.length === 0
      ? "Alles richtig – sehr gut!"
      : qWrong.length + (qWrong.length === 1 ? " Frage kommt" : " Fragen kommen") + " in der nächsten Runde wieder.";
    $("qAgain").textContent = qWrong.length ? "Falsche wiederholen (" + qWrong.length + ")" : "Nächste Runde";
    renderQuizTimeline();
  }
  $("qAgain").addEventListener("click", () => {
    if (qWrong.length) startQuiz(qQueue.filter((q) => qWrong.includes(q)));
    else startQuizFromSettings();
  });
  $("qNew").addEventListener("click", () => {
    $("qResult").classList.add("hidden");
    $("qStart").classList.remove("hidden");
    renderQuizStart();
  });
  $("qStartBtn").addEventListener("click", startQuizFromSettings);
  $("qQuit").addEventListener("click", () => {
    qRunning = false;
    $("qRun").classList.add("hidden");
    $("qStart").classList.remove("hidden");
    renderQuizStart();
    renderQuizTimeline();
  });

  // Tastatur am Mac: 1–9 wählt eine Antwort, Enter = Prüfen / Weiter / Aufdecken
  document.addEventListener("keydown", (e) => {
    if (view !== "quiz" || !qRunning || e.metaKey || e.ctrlKey || e.altKey) return;
    const q = curQ();
    if (e.key === "Enter") {
      e.preventDefault();
      if (!$("qPrimary").parentElement.classList.contains("hidden")) $("qPrimary").click();
      return;
    }
    const n = parseInt(e.key, 10);
    if (!n) return;
    if (qPhase === "reveal") { if (n === 1) rateCard(true); if (n === 2) rateCard(false); return; }
    const b = $("qOpts").querySelectorAll(".opt")[n - 1];
    if (b) b.click();
  });

  // ================================================================
  //  Start
  // ================================================================
  startRound(ALL);
  const startView = store.get("vm-view", "learn");
  showView(["learn", "years", "quiz"].includes(startView) ? startView : "learn");
</script>
</body>
</html>
